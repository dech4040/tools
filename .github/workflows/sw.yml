name: sw

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Setup SW
      # ------------------------------------------------------------
      - name: Setup SW
        uses: egorpugin/sw-action@master

      # ------------------------------------------------------------
      # SW version
      # ------------------------------------------------------------
      - name: Check SW
        shell: pwsh
        run: |
          .\sw.exe --version

      # ------------------------------------------------------------
      # Build
      #
      # Same basic build method as the original project workflow.
      # Two parallel jobs to reduce MSVC memory consumption.
      # ------------------------------------------------------------
      - name: Build
        shell: pwsh
        run: |
          .\sw.exe `
            -static `
            build `
            -configuration=release `
            -show-output

      # ------------------------------------------------------------
      # Find executables
      # ------------------------------------------------------------
      - name: Find executables
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== Executables ==="

          if (Test-Path ".sw\out") {
            Get-ChildItem ".sw\out" `
              -Recurse `
              -Filter "*.exe" `
              -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host "$($_.FullName)"
              }
          }
          else {
            Write-Host ".sw\out does not exist"
          }

      # ------------------------------------------------------------
      # Upload executables
      # ------------------------------------------------------------
      - name: Upload executables
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AIM-Tools-Windows-x64
          path: .sw/out/**/*.exe
          if-no-files-found: error

      # ------------------------------------------------------------
      # Save build data if something fails
      # ------------------------------------------------------------
      - name: Upload build data on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AIM-Tools-build-failure
          path: |
            .sw/**
            sw.cpp
          if-no-files-found: warn
