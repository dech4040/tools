name: sw

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Install SW
      # ------------------------------------------------------------
      - name: Setup SW
        uses: egorpugin/sw-action@master

      # ------------------------------------------------------------
      # Environment diagnostics
      # ------------------------------------------------------------
      - name: Show environment
        shell: pwsh
        run: |
          Write-Host "=== Windows ==="
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture

          Write-Host ""
          Write-Host "=== CPU ==="
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

          Write-Host ""
          Write-Host "=== RAM ==="
          Get-CimInstance Win32_ComputerSystem |
            Select-Object @{
              Name = "RAM_GB"
              Expression = {
                [math]::Round($_.TotalPhysicalMemory / 1GB, 1)
              }
            }

          Write-Host ""
          Write-Host "=== SW ==="
          .\sw.exe --version

          Write-Host ""
          Write-Host "=== MSVC ==="
          where.exe cl
          cl 2>&1 | Select-Object -First 3

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      - name: Build
        shell: pwsh
        run: |
          .\sw.exe `
            -static `
            build `
            -configuration=release `
            -j=2 `
            -jp=2 `
            -show-output

      # ------------------------------------------------------------
      # Find executables
      # ------------------------------------------------------------
      - name: Find executables
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== EXE files ==="

          if (Test-Path ".sw\out") {
            Get-ChildItem ".sw\out" `
              -Recurse `
              -Filter "*.exe" `
              -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host "$($_.FullName)  $($_.Length) bytes"
              }
          }

      # ------------------------------------------------------------
      # Upload executables
      # ------------------------------------------------------------
      - name: Upload executables
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AIM-Tools-Windows-x64
          path: .sw/out/**/*.exe
          if-no-files-found: error

      # ------------------------------------------------------------
      # Save SW data if build fails
      # ------------------------------------------------------------
      - name: Upload build data on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AIM-Tools-build-failure
          path: |
            .sw/**
            sw.cpp
          if-no-files-found: warn
